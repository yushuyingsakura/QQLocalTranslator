name: Build QQLocalTranslator APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source archive
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name 'QQLocalTranslator*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "QQLocalTranslator ZIP not found in repository root"
            exit 1
          fi
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -maxdepth 3 -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Android project not found after extracting ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -e
          PROP="$PROJECT_DIR/gradle.properties"
          if grep -q '^android.useAndroidX=' "$PROP"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROP"
          else
            echo 'android.useAndroidX=true' >> "$PROP"
          fi
          echo "AndroidX enabled:"
          grep '^android.useAndroidX=' "$PROP"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QQLocalTranslator-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
